# DeFtunes dbt project for the Redshift serving layer.
name: 'dbt_modeling'
version: '1.0.0'
config-version: 2

profile: 'dbt_modeling'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_modeling:
    serving_layer:
      +materialized: table
