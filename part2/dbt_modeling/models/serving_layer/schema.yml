version: 2

models:
  - name: fact_session
    description: "Fact table containing session-level song purchase and engagement events."
    columns:
      - name: session_id
        description: "Session identifier; expected to be unique and not null."
        data_tests:
          - unique
          - not_null
      - name: user_id
      - name: song_id
      - name: artist_id
      - name: price
      - name: liked
      - name: liked_since
      - name: session_start_time

  - name: dim_songs
    description: "Song dimension."
    columns:
      - name: song_id
        description: "Song identifier."
      - name: track_id
      - name: title
      - name: release
      - name: year

  - name: dim_artists
    description: "Artist dimension."
    columns:
      - name: artist_id
        description: "Artist identifier; expected to be unique and not null."
        data_tests:
          - unique
          - not_null
      - name: artist_mbid
      - name: artist_name

  - name: dim_users
    description: "User dimension."
    columns:
      - name: user_id
        description: "User identifier; expected to be unique and not null."
        data_tests:
          - unique
          - not_null
      - name: user_lastname
      - name: user_name
      - name: user_since
      - name: place_name
      - name: country_code
